<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" role="img" aria-labelledby="title desc"><title id="title">Vapor-compression cycle</title><desc id="desc">Compressor, condenser, valve and evaporator connected in a refrigeration loop.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#456f64"/></marker></defs><g fill="none" stroke-width="3" stroke-linejoin="round"><path d="M112 296V112H502" stroke="#7953a0"/><path d="M502 112V296" stroke="#7a8589"/><path d="M502 296H112" stroke="#128a88"/></g><rect x="250" y="87" width="136" height="50" rx="8" fill="#f8e3cf" stroke="#a78e75"/><text x="318" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19363d">Condenser</text><rect x="250" y="271" width="136" height="50" rx="8" fill="#d4e9e1" stroke="#70978b"/><text x="318" y="301" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19363d">Evaporator</text><circle cx="112" cy="205" r="29" fill="#eadff0" stroke="#9573a8" stroke-width="1.5"/><path d="M98 216L112 191L126 216Z" fill="#7953a0"/><text x="112" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19363d">Compressor</text><path d="M482 186L522 224V186L482 224Z" fill="#d9dfd6" stroke="#7a8589" stroke-width="1.5"/><text x="502" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19363d">Valve</text><path d="M112 157V137M413 112H438M502 257V278M225 296H199" fill="none" stroke="#456f64" stroke-width="2" marker-end="url(#arrow)"/><g fill="#fffefa" stroke="#46695f" stroke-width="1.3"><circle cx="112" cy="278" r="13"/><circle cx="112" cy="139" r="13"/><circle cx="502" cy="139" r="13"/><circle cx="502" cy="278" r="13"/></g><g text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#19363d" font-weight="700"><text x="112" y="278">1</text><text x="112" y="139">2</text><text x="502" y="139">3</text><text x="502" y="278">4</text></g><text x="318" y="183" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#627b71">Heat to the surroundings ↑</text><text x="318" y="233" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#627b71">↑ Heat from the cooled space</text><text x="310" y="385" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#45685e">Vapor-compression refrigeration</text></svg>
