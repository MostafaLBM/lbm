<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" role="img" aria-labelledby="title desc"><title id="title">Rankine cycle illustration</title><desc id="desc">A schematic of a boiler, turbine, condenser and pump beside a temperature–entropy diagram.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#456f64"/></marker></defs><g fill="none" stroke-linejoin="round"><path d="M112 287V118H452" stroke="#c15a2c" stroke-width="3"/><path d="M452 118H506V287H112" stroke="#176c67" stroke-width="3"/><path d="M112 160V139M290 118H325M506 185V207M285 287H253" stroke="#456f64" stroke-width="2" marker-end="url(#arrow)"/></g><rect x="68" y="171" width="88" height="78" rx="9" fill="#f8e3cf" stroke="#a78e75"/><path d="M82 210L94 196L106 222L118 196L130 222L142 210" stroke="#c15a2c" fill="none" stroke-width="2"/><text x="112" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19363d">Boiler</text><path d="M407 96L466 79V157L407 140Z" fill="#eadff0" stroke="#9573a8" stroke-width="1.5"/><text x="436" y="65" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19363d">Turbine</text><rect x="396" y="263" width="96" height="48" rx="9" fill="#d4e9e1" stroke="#70978b"/><text x="444" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19363d">Condenser</text><circle cx="204" cy="287" r="24" fill="#d8e6ef" stroke="#678ca7"/><path d="M215 274L192 287L215 300Z" fill="#537f9c"/><text x="204" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19363d">Pump</text><g fill="#fffefa" stroke="#46695f" stroke-width="1.3"><circle cx="300" cy="287" r="13"/><circle cx="112" cy="141" r="13"/><circle cx="335" cy="118" r="13"/><circle cx="506" cy="227" r="13"/></g><g text-anchor="middle" dominant-baseline="central" font-family="system-ui,sans-serif" font-size="11" fill="#19363d" font-weight="700"><text x="300" y="287">1</text><text x="112" y="141">2</text><text x="335" y="118">3</text><text x="506" y="227">4</text></g><rect x="225" y="166" width="148" height="94" rx="7" fill="#f9fbf5" stroke="#c8d7ca"/><path d="M247 180V243H353" stroke="#9eafa4" fill="none"/><path d="M251 235Q290 153 341 235" fill="none" stroke="#b3c3b2" stroke-width="1.3"/><path d="M262 229L262 225Q272 207 282 206L317 188V229Z" fill="#176c67" fill-opacity=".07" stroke="#176c67" stroke-width="1.8"/><text x="237" y="183" font-family="Georgia,serif" font-style="italic" font-size="12" fill="#627b71">T</text><text x="350" y="254" font-family="Georgia,serif" font-style="italic" font-size="12" fill="#627b71">s</text><text x="310" y="385" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#45685e">Heat in. Work out. Follow the cycle.</text></svg>
